<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Authentication Complete</title>
</head>
<body>
  <p>Authentication complete. If this window does not close automatically, you can close it.</p>
  <script>
    function postAuthenticationMessage() {
      var href = window.location.href;
      if (!window.location.search && window.location.hash) {
        href = window.location.origin + window.location.pathname + "?" + window.location.hash.substring(1);
      }
      var message = {
        "flutter-web-auth-2": href
      };

      try {
        localStorage.setItem("flutter-web-auth-2", href);
      } catch (e) {}

      if (window.opener) {
        window.opener.postMessage(message, "*");
      }
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(message, "*");
      }

      setTimeout(function() {
        window.close();
      }, 200);
    }

    postAuthenticationMessage();
  </script>
</body>
</html>
