class: Attempt
table: attempt
fields:
  profileId: int
  questionId: int
  selectedOptionId: int?
  answerText: String?
  status: AttemptStatus
  responseMs: int
  usedHelp: bool
  isFirstAttempt: bool
  underExpectedTime: bool
  isClean: bool
  reflexTier: ReflexTier
  createdAt: DateTime
indexes:
  attempt_profile_idx:
    fields: profileId
  attempt_question_idx:
    fields: questionId
