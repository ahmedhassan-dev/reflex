services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: reflex
      POSTGRES_PASSWORD: "YPMVf_v_oijIRvvFDpat6nFOF3tcQ0iw"
    volumes:
      - reflex_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "WPhLDMQn35YFhtk9UlQcU0lHYuAry-9O"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: reflex_test
      POSTGRES_PASSWORD: "o9MPLOXZVMPbKn0JUtTu4ZbKc1Aa27Vv"
    volumes:
      - reflex_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "9pPrFUu0vkA9-8NGGAl5B9YFW2fOjxVH"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  reflex_data:
  reflex_test_data:
